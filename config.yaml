name: "Jakes Station Rip Tool"
description: "Rips multiple internet radio streams simultaneously into perfect, tagged MP3s using custom Streamripper forks"
version: "2026.10.04-1"
slug: "jakesstationrip"
init: false
arch:
  - aarch64
  - amd64
startup: "application"
boot: "auto"
url: "https://github.com/JakeLC15/Jakes-Radio-Rip"
ingress: true
ingress_port: 8099
panel_title: "Jakes Station Rip Tool"
panel_icon: mdi:folder-music-outline
webui: "http://[HOST]:[PORT:8099]/"
panel: true
stdin: true
map:
  - media:rw
  - share:rw
options:
  output_dir: "/media/music/jakes_station_rip"
  streams: []
  logging: false
  min_file_size_mb: 1
  continuous_recording: false
schema:
  output_dir: str
  streams:
    - str
  logging: bool
  min_file_size_mb: int(1,)
  continuous_recording: bool
