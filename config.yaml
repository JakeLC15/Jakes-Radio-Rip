name: "Jakes Station Rip Tool"
description: "Rips multiple internet radio streams simultaneously into perfect, tagged MP3s using custom Streamripper forks"
version: "2026.10.04-1"
slug: "jakesstationrip"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: "application"
boot: "auto"
ingress: true
ingress_port: 8099
panel_title: "Jakes Station Ripper"
webui: "http://[HOST]:[PORT:8099]/"
panel: true
stdin: true
map:
  - media:rw
  - share:rw
options:
  output_dir: "/media/music/jakes_station_rip"
  streams: []
  logging: false
schema:
  output_dir: str
  streams:
    - str
  logging: bool
